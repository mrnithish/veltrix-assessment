[project]
name = "veltrix-assistant"
version = "0.1.0"
description = "Veltrix PeopleOps Assistant: HR RAG + leave tools with Code Mode orchestration"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=2.3.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "openai>=3.42.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pillow>=13.0.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.2",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "rapidocr>=3.10.0",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF005", "RUF012", "B904", "B905", "E501", "SIM102", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"app/api/*.py" = ["B008"]  # FastAPI Depends() idiom
"tests/test_app_api.py" = ["F811"]  # imported pytest fixtures
"tests/test_platform.py" = ["F811"]
